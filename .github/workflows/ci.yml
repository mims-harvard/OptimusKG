name: Integration checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLICOLOR: 1

jobs:
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project dependencies
        run: uv sync --all-groups --frozen

      - name: Run ty
        run: make ty

      - name: Run interrogate
        run: make interrogate

  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Spell Check
        uses: crate-ci/typos@v1.46.2

      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          args: check

      - name: Format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  semver-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - uses: rayepps/require-semver-bump@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          file: pyproject.toml
          pattern: >
            version = ["'](.+?)["']

