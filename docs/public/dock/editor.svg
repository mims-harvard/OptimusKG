  <rect x="2.75" y="2.75" width="394.5" height="394.5" rx="90.25" ry="90.25" fill="none" stroke="url(#editorRim)" stroke-width="1.5"/>

  <g filter="url(#editorGlyphShadow)" stroke="url(#editorGlyph)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M140 155 L92 200 L140 245"/>
