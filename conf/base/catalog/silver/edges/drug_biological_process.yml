silver.edges.drug_biological_process:
  type: optimuskg.datasets.polars.ParquetDataset
  filepath: data/silver/edges/drug_biological_process.parquet
  load_args:
    schema:
      from: pl.String
      to: pl.String
      label: pl.String
      relation: pl.String
      undirected: pl.Boolean
      properties:
        sources:
          direct: pl.List(pl.String)
          indirect: pl.List(pl.String)
        reference_ids: pl.List(pl.String)
        highest_clinical_trial_phase: pl.Float64
  metadata:
    kedro-viz:
      layer: silver
