# Evaluation dataset generation parameters

edge_eval:
  # Data paths (gold KG exports)
  nodes_path: data/gold/kg/parquet/nodes.parquet
  edges_path: data/gold/kg/parquet/edges.parquet
  out_dir: data/gold/evals

  # Centrality percentile range for node sampling
  # Nodes between top X% and top Y% are eligible for sampling
  centrality_upper: 10     # Upper bound (top 10%)
  centrality_lower: 90     # Lower bound (top 90%)

  # Sampling parameters
  nodes_per_type: 100    # Nodes to sample per node type
  true_neighbors: 10     # Max true neighbors to sample per node
  false_neighbors: 1     # False neighbors to sample per node

  # Reproducibility
  seed: 42

power_analysis:
  # Two-sided significance level for all reported intervals
  alpha: 0.05

  # USD per evaluated edge, used only for the cost-precision tradeoff. Each
  # PaperQA3 query consumes one credit, priced at $1 at the time of submission.
  cost_per_edge_usd: 1.0

  # Strata with fewer effective observations than this are reported as
  # descriptive only, not as estimates
  min_usable_effective_n: 30
